<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="M R S – Professional Automation &amp; Digital Services">
  <title>M R S – Professional Automation &amp; Digital Services</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="60%" stop-color="#111B2E" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>

    <!-- Node Glow -->
    <radialGradient id="og-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <circle cx="280" cy="315" r="320" fill="url(#og-glow)" />

  <!-- Subdued Grid Lines -->
  <g stroke="#22314D" stroke-width="1" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Large Connected 3-Node Operational Glyph -->
  <g transform="translate(100, 200)">
    <rect width="130" height="130" rx="32" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-width="3" stroke-opacity="0.4" />
    <line x1="46" y1="96" x2="84" y2="96" stroke="#06B6D4" stroke-width="5" stroke-linecap="round" />
    <line x1="42" y1="85" x2="58" y2="44" stroke="#06B6D4" stroke-width="5" stroke-linecap="round" />
    <line x1="88" y1="85" x2="72" y2="44" stroke="#06B6D4" stroke-width="5" stroke-linecap="round" />

    <circle cx="32" cy="96" r="13" fill="#0B1220" stroke="#06B6D4" stroke-width="5" />
    <circle cx="32" cy="96" r="5" fill="#22D3EE" />

    <circle cx="98" cy="96" r="13" fill="#0B1220" stroke="#06B6D4" stroke-width="5" />
    <circle cx="98" cy="96" r="5" fill="#22D3EE" />

    <circle cx="65" cy="32" r="13" fill="#0B1220" stroke="#06B6D4" stroke-width="5" />
    <circle cx="65" cy="32" r="5" fill="#22D3EE" />
  </g>

  <!-- Primary Brand Block -->
  <g transform="translate(260, 220)">
    <!-- Wordmark -->
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="0.05em" fill="#FFFFFF">
      M R S
    </text>
    
    <!-- OPS Badge -->
    <rect x="230" y="10" width="80" height="38" rx="8" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.5" />
    <text x="270" y="36" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#22D3EE">
      OPS
    </text>

    <!-- Subtitle / Full Name -->
    <text x="0" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#E6EDF7">
      Professional Automation &amp; Digital Services
    </text>

    <!-- Tagline -->
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#22D3EE">
      Automate. Deliver. Grow.
    </text>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(100, 575)">
    <text x="0" y="0" font-family="monospace" font-size="16" fill="#8FA3C0">
      mrs-services.ai.studio
    </text>
    <text x="1000" y="0" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#8FA3C0">
      Verified Workflows • Guaranteed Turnaround • Direct Delivery
    </text>
  </g>
</svg>
